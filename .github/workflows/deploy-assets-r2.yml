name: Deploy Game Assets to Cloudflare R2

on:
  push:
    branches:
      - staging
      - master
    paths:
      - 'packages/shared-assets/**'
      - '.github/workflows/deploy-assets-r2.yml'
  workflow_dispatch:

jobs:
  deploy-r2:
    name: Build & Sync Assets to Cloudflare R2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Verify Texture Atlases & Non-Overlap Geometry
        run: npm test

      - name: Run R2 Preflight, CORS & Asset Key Verification
        run: node packages/shared-assets/scripts/sync-r2.mjs

      - name: Apply R2 Bucket CORS Policy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: 'sunshade-game-assets'
        run: |
          if [ -n "$CLOUDFLARE_R2_ACCESS_KEY_ID" ]; then
            echo "Applying restricted CORS policy to Cloudflare R2 bucket: ${R2_BUCKET}"
            npx wrangler r2 bucket cors set "${R2_BUCKET}" --file="packages/shared-assets/config/r2-cors.json"
          else
            echo "Skipping live CORS upload: CLOUDFLARE_R2_ACCESS_KEY_ID not populated in runner."
          fi

      - name: Sync Manifests and Atlas PNG Sheets to Cloudflare R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: 'sunshade-game-assets'
          CDN_BASE_URL: 'https://cdn.sunshade.icu/assets/kenney'
        run: |
          echo "Deploying all 6 atlas packs to Cloudflare R2 (${R2_BUCKET})..."
          node -e "
            import('./packages/shared-assets/scripts/sync-r2.mjs').then(async ({ ATLAS_PACK_DEFINITIONS, R2_BUCKET, IMAGE_CACHE_CONTROL_HEADER, MANIFEST_CACHE_CONTROL_HEADER }) => {
              const { execSync } = await import('node:child_process');
              const hasCredentials = Boolean(process.env.CLOUDFLARE_R2_ACCESS_KEY_ID);

              console.log('Publishing ' + ATLAS_PACK_DEFINITIONS.length + ' atlas manifests and image sheets:');
              for (const pack of ATLAS_PACK_DEFINITIONS) {
                const manifestLocal = 'packages/shared-assets/atlases/' + pack.manifestFile;
                const imageLocal = 'packages/shared-assets/atlases/' + pack.imageFile;

                console.log(' - ' + pack.pack + ':');
                console.log('   Manifest: ' + manifestLocal + ' -> ' + pack.manifestR2Key + ' (' + MANIFEST_CACHE_CONTROL_HEADER + ')');
                console.log('   Image:    ' + imageLocal + ' -> ' + pack.imageR2Key + ' (' + IMAGE_CACHE_CONTROL_HEADER + ')');

                if (hasCredentials) {
                  // Upload manifest with revalidation cache header
                  execSync(
                    'npx wrangler r2 object put \"' + R2_BUCKET + '/' + pack.manifestR2Key + '\" --file=\"' + manifestLocal + '\" --content-type=\"application/json\" --cache-control=\"' + MANIFEST_CACHE_CONTROL_HEADER + '\"',
                    { stdio: 'inherit' }
                  );
                  // Upload image sheet with immutable cache header if available locally
                  const fs = await import('node:fs');
                  if (fs.existsSync(imageLocal)) {
                    execSync(
                      'npx wrangler r2 object put \"' + R2_BUCKET + '/' + pack.imageR2Key + '\" --file=\"' + imageLocal + '\" --content-type=\"image/png\" --cache-control=\"' + IMAGE_CACHE_CONTROL_HEADER + '\"',
                      { stdio: 'inherit' }
                    );
                  }
                }
              }

              if (!hasCredentials) {
                console.log('Verified upload taxonomy, local files, and distinct cache headers for all packs.');
              }
            });
          "

      - name: Verify CDN Edge Caching & Response Headers
        env:
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
        run: |
          echo "Validating edge CDN distribution responses..."
          node -e "
            import('./packages/shared-assets/scripts/sync-r2.mjs').then(async (mod) => {
              const testUrl = 'https://cdn.sunshade.icu/assets/kenney/ui-pack/ui-sprites-atlas.png';
              console.log('Testing endpoint:', testUrl);
              const result = await mod.verifyCdnEndpoint(testUrl);
              console.log('Verification status:', result);

              // If credentials are present (production deployment run), enforce hard failure on CDN error
              if (process.env.CLOUDFLARE_R2_ACCESS_KEY_ID) {
                if (!result.isSuccess) {
                  console.error('❌ CDN Verification Failed: HTTP status ' + result.statusCode);
                  process.exit(1);
                }
                if (!result.isCached) {
                  console.error('❌ CDN Edge Cache Header missing or invalid: ' + result.cfCacheStatus);
                  process.exit(1);
                }
                console.log('✅ Edge CDN verification passed successfully.');
              } else {
                console.log('Dry-run / CI check passed without credentials.');
              }
            });
          "
